name: Dependency policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up the pinned Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.10"
          cache: ""
          check-latest: false

      - name: Validate dependency policy
        shell: pwsh
        run: python tools/check_dependency_policy.py --verify-pypi --ca-bundle tools/trust/certifi-2026.6.17.pem

      - name: Run standard-library security tests
        shell: pwsh
        run: >-
          python -m unittest -v
          tests.test_action_feature_gates
          tests.test_audio_temp_privacy
          tests.test_capability_registry
          tests.test_capture_exclusion
          tests.test_compose_insertion
          tests.test_compose_service
          tests.test_dependency_policy
          tests.test_dictation_insertion
          tests.test_dictation_session
          tests.test_dictation_targeting
          tests.test_dpapi_storage
          tests.test_offline_model_loading
          tests.test_packaged_self_test
          tests.test_privacy_consent
          tests.test_provider_security
          tests.test_quarantine_harness
          tests.test_response_provider_terminology
          tests.test_security_hardening
          tests.test_stt_vocabulary_contract
          tests.test_style_profiles
          tests.test_turn_coordinator
          tests.test_validation_boundary
          tests.test_windows_runtime_validation
          tests.test_windows_sandbox_results

      - name: Parse every Python source file
        shell: pwsh
        run: |
          @'
          import ast
          from pathlib import Path

          non_source_dirs = {".git", ".venv", "build", "dist"}
          files = sorted(
              path
              for path in Path(".").rglob("*.py")
              if non_source_dirs.isdisjoint(path.parts)
          )
          if not files:
              raise SystemExit("No Python source files found")
          for path in files:
              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=str(path),
              )
          print(f"AST validation OK: {len(files)} Python files")
          '@ | python -

  locked-build:
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up the pinned Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.10"
          cache: ""
          check-latest: false

      - name: Set up the pinned uv toolchain
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"
          enable-cache: false

      - name: Install the frozen wheel-only environment
        shell: pwsh
        run: >-
          uv sync --frozen --group build --no-build
          --no-managed-python --no-python-downloads --python "3.12.10"
          --keyring-provider disabled --no-cache

      - name: Run security tests from the locked environment
        shell: pwsh
        run: uv run --no-sync python -m unittest discover -s tests -p "test_*.py" -v

      - name: Parse every Python source from the locked environment
        shell: pwsh
        run: |
          @'
          import ast
          from pathlib import Path

          non_source_dirs = {".git", ".venv", "build", "dist"}
          files = sorted(
              path
              for path in Path(".").rglob("*.py")
              if non_source_dirs.isdisjoint(path.parts)
          )
          if not files:
              raise SystemExit("No Python source files found")
          for path in files:
              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=str(path),
              )
          print(f"AST validation OK: {len(files)} Python files")
          '@ | uv run --no-sync python -

      - name: Build the unsigned smoke-test artifact
        shell: pwsh
        run: uv run --no-sync python -m PyInstaller clicky.spec --clean --noconfirm

      - name: Remove unsigned build outputs
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue build, dist
