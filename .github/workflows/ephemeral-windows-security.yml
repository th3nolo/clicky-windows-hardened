name: Ephemeral Windows quarantine

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact lowercase 40-character target commit SHA
        required: true
        type: string
      age_ssh_public_recipient:
        description: One-time ssh-ed25519 or ssh-rsa public key for age encryption
        required: true
        type: string
      export_for_vendor_submission:
        description: Retain only encrypted Clicky.exe for vendor false-positive submission
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: clicky-ephemeral-quarantine
  cancel-in-progress: false

env:
  GIT_CONFIG_NOSYSTEM: "1"
  GIT_CONFIG_GLOBAL: NUL
  GIT_NO_REPLACE_OBJECTS: "1"
  GIT_TERMINAL_PROMPT: "0"
  GCM_INTERACTIVE: Never
  UV_DEFAULT_INDEX: https://pypi.org/simple
  UV_INDEX_STRATEGY: first-index
  PIP_INDEX_URL: ""
  PIP_EXTRA_INDEX_URL: ""
  UV_INDEX: ""
  UV_INDEX_URL: ""
  UV_EXTRA_INDEX_URL: ""
  GIT_CONFIG_COUNT: "4"
  GIT_CONFIG_KEY_0: core.hooksPath
  GIT_CONFIG_VALUE_0: NUL
  GIT_CONFIG_KEY_1: core.fsmonitor
  GIT_CONFIG_VALUE_1: "false"
  GIT_CONFIG_KEY_2: protocol.file.allow
  GIT_CONFIG_VALUE_2: never
  GIT_CONFIG_KEY_3: credential.helper
  GIT_CONFIG_VALUE_3: ""
  INPUT_TARGET_SHA: ${{ inputs.target_sha }}
  QUARANTINE_ARTIFACT: clicky-quarantine-${{ github.run_id }}-${{ github.run_attempt }}
  VENDOR_EXPORT_ARTIFACT: clicky-vendor-sample-${{ github.run_id }}-${{ github.run_attempt }}
  VENDOR_EXPORT_TARGET_SHA: d8a6a8c462a2c7a70577a17a27a05d9dbafd4504

jobs:
  build-runtime:
    name: Build and runtime validation (no secrets)
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      source_sha256: ${{ steps.bind_source.outputs.source_sha256 }}
    env:
      INPUT_AGE_SSH_PUBLIC_RECIPIENT: ${{ inputs.age_ssh_public_recipient }}
    steps:
      - name: Check out only the trusted workflow revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          set-safe-directory: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Set up the pinned Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.10"
          cache: ""
          check-latest: false

      - name: Validate trusted context and recipient
        shell: pwsh
        run: |
          python trusted/tools/quarantine_harness.py validate-context `
            --recipient-output "$env:RUNNER_TEMP\age-recipient.txt"
          if ($LASTEXITCODE -ne 0) { throw "trusted context validation failed" }
          if ("${{ inputs.export_for_vendor_submission }}" -ceq "true" -and
              $env:INPUT_TARGET_SHA -cne $env:VENDOR_EXPORT_TARGET_SHA) {
            throw "vendor export is restricted to the reviewed source-only merge"
          }

      - name: Capture the trusted harness identity before candidate execution
        shell: pwsh
        run: |
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath "trusted\tools\quarantine_harness.py").Hash.ToLowerInvariant()
          "TRUSTED_HARNESS_SHA256=$digest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Record the hosted runner Git identity
        shell: pwsh
        run: |
          $command = Get-Command git.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1
          if ($null -eq $command -or [String]::IsNullOrWhiteSpace($command.Path)) {
            throw "hosted git.exe command resolution failed"
          }
          $git = Get-Item -LiteralPath $command.Path -Force -ErrorAction Stop
          if ($git.PSIsContainer) {
            throw "hosted git.exe resolved to a directory"
          }
          $version = & $command.Path --version
          if ($LASTEXITCODE -ne 0 -or $version -cnotmatch '^git version [0-9]') {
            throw "hosted git.exe did not report a valid version"
          }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $git.FullName).Hash.ToLowerInvariant()
          $signature = Get-AuthenticodeSignature -LiteralPath $git.FullName
          $identity = [ordered]@{
            path = $git.FullName
            attributes = $git.Attributes.ToString()
            link_type = $git.LinkType
            link_target = $git.Target
            version = $version
            product_version = $git.VersionInfo.ProductVersion
            file_version = $git.VersionInfo.FileVersion
            sha256 = $digest
            authenticode_status = $signature.Status.ToString()
            signer_thumbprint = if ($null -eq $signature.SignerCertificate) { $null } else { $signature.SignerCertificate.Thumbprint }
          }
          $identity | ConvertTo-Json -Compress | Write-Output
          "CLICKY_HOSTED_GIT_EXE=$($git.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out the exact untrusted target
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.target_sha }}
          path: target
          persist-credentials: false
          set-safe-directory: false
          fetch-depth: 1
          clean: true
          lfs: false
          submodules: false
          show-progress: false
          ssh-strict: true

      - name: Harden target Git metadata and bind the source archive
        id: bind_source
        shell: pwsh
        run: >-
          python trusted/tools/quarantine_harness.py verify-target-checkout
          --root target
          --source-output "$env:RUNNER_TEMP\clicky-stage\clicky-source.zip"
          --target-sha "$env:INPUT_TARGET_SHA"
          --github-output "$env:GITHUB_OUTPUT"

      - name: Set up the pinned uv toolchain
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"
          enable-cache: false

      - name: Validate the target dependency policy
        working-directory: target
        shell: pwsh
        run: >-
          python tools/check_dependency_policy.py --verify-pypi
          --ca-bundle tools/trust/certifi-2026.6.17.pem

      - name: Install the frozen wheel-only environment
        working-directory: target
        shell: pwsh
        run: >-
          uv sync --frozen --group build --no-build
          --no-managed-python --no-python-downloads --python "3.12.10"
          --default-index "https://pypi.org/simple" --index-strategy first-index
          --keyring-provider disabled --link-mode copy --no-cache

      - name: Run locked security tests
        working-directory: target
        shell: pwsh
        run: >-
          uv run --frozen --no-sync --python "3.12.10"
          python -W error -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile target Python sources
        working-directory: target
        shell: pwsh
        run: >-
          uv run --frozen --no-sync --python "3.12.10" python -W error
          -m compileall -q ai audio screen skills tools ui
          companion_manager.py config.py main.py packaged_self_test.py

      - name: Build the unsigned onedir distribution
        working-directory: target
        shell: pwsh
        run: >-
          uv run --frozen --no-sync --python "3.12.10"
          python -m PyInstaller clicky.spec --clean --noconfirm

      - name: Materialize fixed unsigned warning
        working-directory: target
        shell: pwsh
        run: |
          $marker = Join-Path $PWD "dist\Clicky\UNSIGNED-LOCAL-TEST-ONLY.txt"
          if (-not (Test-Path -LiteralPath "dist\Clicky\Clicky.exe" -PathType Leaf)) {
            throw "PyInstaller did not produce Clicky.exe"
          }
          $markerText = @(
            "UNSIGNED LOCAL TEST ARTIFACT"
            ""
            "DO NOT DISTRIBUTE OR REPRESENT THIS BUILD AS A RELEASE."
            "It has not been Authenticode-signed or verified by a release pipeline."
            "Rebuild through the future signing pipeline before any distribution."
            ""
          ) -join "`r`n"
          [System.IO.File]::WriteAllText(
            $marker,
            $markerText,
            [System.Text.UTF8Encoding]::new($false)
          )
          if ([System.IO.File]::ReadAllText($marker) -cne $markerText) {
            throw "unsigned warning marker did not round-trip exactly"
          }

      - name: Run target runtime validation in the ephemeral runner
        working-directory: target
        shell: pwsh
        env:
          CLICKY_GITHUB_EPHEMERAL_RUNNER: "1"
          CLICKY_EXPECTED_COMMIT: ${{ inputs.target_sha }}
          CLICKY_CHECKED_OUT_COMMIT: ${{ inputs.target_sha }}
          CLICKY_TRUSTED_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: >-
          uv run --frozen --no-sync --python "3.12.10"
          python tools/windows_runtime_validation.py
          --output "$env:RUNNER_TEMP\clicky-stage\runtime-validation.json"
          --distribution-archive "$env:RUNNER_TEMP\clicky-stage\clicky-full-dist.zip"
          --executable-copy "$env:RUNNER_TEMP\clicky-stage\clicky-executable.exe"

      - name: Assemble deterministic runtime evidence
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA256: ${{ steps.bind_source.outputs.source_sha256 }}
        run: |
          function Assert-TrustedHarness {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath "trusted\tools\quarantine_harness.py").Hash.ToLowerInvariant()
            if ($actual -cne $env:TRUSTED_HARNESS_SHA256) { throw "trusted harness changed after candidate execution" }
          }
          Assert-TrustedHarness
          python trusted/tools/quarantine_harness.py assemble `
            --source "$env:RUNNER_TEMP\clicky-stage\clicky-source.zip" `
            --runtime-report "$env:RUNNER_TEMP\clicky-stage\runtime-validation.json" `
            --distribution "$env:RUNNER_TEMP\clicky-stage\clicky-full-dist.zip" `
            --executable-copy "$env:RUNNER_TEMP\clicky-stage\clicky-executable.exe" `
            --output "$env:RUNNER_TEMP\clicky-stage\clicky-runtime-evidence.zip" `
            --target-sha "$env:INPUT_TARGET_SHA" `
            --expected-source-sha256 "$env:EXPECTED_SOURCE_SHA256" `
            --workflow-sha "$env:GITHUB_WORKFLOW_SHA"
          if ($LASTEXITCODE -ne 0) { throw "trusted evidence assembly failed" }
          Assert-TrustedHarness

      - name: Install hash-pinned age 1.3.1
        id: install_age
        shell: pwsh
        run: |
          function Assert-TrustedHarness {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath "trusted\tools\quarantine_harness.py").Hash.ToLowerInvariant()
            if ($actual -cne $env:TRUSTED_HARNESS_SHA256) { throw "trusted harness changed after candidate execution" }
          }
          Assert-TrustedHarness
          python trusted/tools/quarantine_harness.py install-age --output "$env:RUNNER_TEMP\age\age.exe" --github-output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw "pinned age installation failed" }
          Assert-TrustedHarness

      - name: Encrypt each candidate before artifact upload
        shell: pwsh
        env:
          PINNED_AGE_EXE_SHA256: ${{ steps.install_age.outputs.age_exe_sha256 }}
        run: |
          $age = "$env:RUNNER_TEMP\age\age.exe"
          function Assert-AgeIdentity {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $age).Hash.ToLowerInvariant()
            if ($actual -cne $env:PINNED_AGE_EXE_SHA256) { throw "age.exe identity changed" }
          }
          $recipient = "$env:RUNNER_TEMP\age-recipient.txt"
          $plain = "$env:RUNNER_TEMP\clicky-stage"
          $cipher = "$env:RUNNER_TEMP\clicky-ciphertext"
          New-Item -ItemType Directory -Path $cipher -ErrorAction Stop | Out-Null
          Assert-AgeIdentity
          & $age -R $recipient -o "$cipher\clicky-executable.exe.age" "$plain\clicky-executable.exe"
          if ($LASTEXITCODE -ne 0) { throw "age failed for executable" }
          if ("${{ inputs.export_for_vendor_submission }}" -cne "true") {
            Assert-AgeIdentity
            & $age -R $recipient -o "$cipher\clicky-source.zip.age" "$plain\clicky-source.zip"
            if ($LASTEXITCODE -ne 0) { throw "age failed for source archive" }
            Assert-AgeIdentity
            & $age -R $recipient -o "$cipher\clicky-full-dist.zip.age" "$plain\clicky-full-dist.zip"
            if ($LASTEXITCODE -ne 0) { throw "age failed for distribution archive" }
            Assert-AgeIdentity
            & $age -R $recipient -o "$cipher\clicky-runtime-evidence.zip.age" "$plain\clicky-runtime-evidence.zip"
            if ($LASTEXITCODE -ne 0) { throw "age failed for runtime evidence" }
          }
          Assert-AgeIdentity
          Remove-Item -LiteralPath $plain -Recurse -Force

      - name: Prove the upload directory is ciphertext-only and bounded
        if: ${{ !inputs.export_for_vendor_submission }}
        shell: pwsh
        run: |
          function Assert-TrustedHarness {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath "trusted\tools\quarantine_harness.py").Hash.ToLowerInvariant()
            if ($actual -cne $env:TRUSTED_HARNESS_SHA256) { throw "trusted harness changed after candidate execution" }
          }
          Assert-TrustedHarness
          python trusted/tools/quarantine_harness.py verify-ciphertext --directory "$env:RUNNER_TEMP\clicky-ciphertext"
          if ($LASTEXITCODE -ne 0) { throw "ciphertext boundary verification failed" }
          Assert-TrustedHarness

      - name: Prove the vendor upload contains one bounded ciphertext
        if: ${{ inputs.export_for_vendor_submission }}
        shell: pwsh
        run: |
          $cipher = "$env:RUNNER_TEMP\clicky-ciphertext"
          $entries = @(Get-ChildItem -LiteralPath $cipher -Force)
          if ($entries.Count -ne 1) { throw "vendor export must contain exactly one entry" }
          $entry = $entries[0]
          if ($entry.Name -cne "clicky-executable.exe.age") {
            throw "vendor export contains an unexpected filename"
          }
          if ($entry.PSIsContainer -or $entry.LinkType -or
              ($entry.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw "vendor export is not a plain ciphertext file"
          }
          if ($entry.Length -le 0 -or $entry.Length -gt 134217728) {
            throw "vendor ciphertext size is outside the reviewed bound"
          }
          $stream = [IO.File]::OpenRead($entry.FullName)
          try {
            $header = [byte[]]::new(22)
            if ($stream.Read($header, 0, $header.Length) -ne $header.Length) {
              throw "vendor ciphertext header is truncated"
            }
          } finally {
            $stream.Dispose()
          }
          $magic = [Text.Encoding]::ASCII.GetString($header)
          if (-not $magic.StartsWith("age-encryption.org/v1")) {
            throw "vendor export is not an age ciphertext"
          }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $entry.FullName).Hash.ToLowerInvariant()
          Write-Output "VENDOR_CIPHERTEXT_SHA256=$digest"

      - name: Upload only encrypted quarantine files
        if: ${{ !inputs.export_for_vendor_submission }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.QUARANTINE_ARTIFACT }}
          path: ${{ runner.temp }}/clicky-ciphertext/*.age
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Upload the encrypted vendor-submission sample
        if: ${{ inputs.export_for_vendor_submission }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.VENDOR_EXPORT_ARTIFACT }}
          path: ${{ runner.temp }}/clicky-ciphertext/clicky-executable.exe.age
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Remove local plaintext and ciphertext
        if: always()
        shell: pwsh
        run: >-
          Remove-Item -LiteralPath
          "$env:RUNNER_TEMP\clicky-stage",
          "$env:RUNNER_TEMP\clicky-ciphertext",
          "$env:RUNNER_TEMP\age",
          "$env:RUNNER_TEMP\age-recipient.txt",
          "$env:GITHUB_WORKSPACE\target\build",
          "$env:GITHUB_WORKSPACE\target\dist"
          -Recurse -Force -ErrorAction SilentlyContinue

  verify-evidence:
    name: Verify evidence (age key only)
    needs: build-runtime
    if: ${{ !inputs.export_for_vendor_submission && needs.build-runtime.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha256: ${{ steps.verify.outputs.source_sha256 }}
      distribution_sha256: ${{ steps.verify.outputs.distribution_sha256 }}
      executable_sha256: ${{ steps.verify.outputs.executable_sha256 }}
      evidence_sha256: ${{ steps.verify.outputs.evidence_sha256 }}
    env:
      EXPECTED_SOURCE_SHA256: ${{ needs.build-runtime.outputs.source_sha256 }}
    steps:
      - name: Check out only the trusted workflow revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          set-safe-directory: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Set up the pinned Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.10"
          cache: ""
          check-latest: false

      - name: Validate trusted context
        shell: pwsh
        run: python trusted/tools/quarantine_harness.py validate-context

      - name: Download the encrypted artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.QUARANTINE_ARTIFACT }}
          path: ${{ runner.temp }}/clicky-ciphertext

      - name: Verify ciphertext-only boundaries
        shell: pwsh
        run: >-
          python trusted/tools/quarantine_harness.py verify-ciphertext
          --directory "$env:RUNNER_TEMP\clicky-ciphertext"

      - name: Install hash-pinned age 1.3.1
        shell: pwsh
        run: >-
          python trusted/tools/quarantine_harness.py install-age
          --output "$env:RUNNER_TEMP\age\age.exe"

      - name: Materialize the one-time age identity
        shell: pwsh
        env:
          AGE_SSH_PRIVATE_KEY: ${{ secrets.AGE_SSH_PRIVATE_KEY }}
        run: |
          if ([String]::IsNullOrWhiteSpace($env:AGE_SSH_PRIVATE_KEY)) {
            throw "AGE_SSH_PRIVATE_KEY is missing"
          }
          $identity = "$env:RUNNER_TEMP\age-identity.txt"
          [IO.File]::WriteAllText(
            $identity,
            $env:AGE_SSH_PRIVATE_KEY.Trim() + "`n",
            [Text.UTF8Encoding]::new($false)
          )
          & icacls.exe $identity /inheritance:r /grant:r "$env:USERNAME`:F" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "could not protect age identity ACL" }

      - name: Decrypt and validate all evidence
        id: verify
        shell: pwsh
        run: |
          $age = "$env:RUNNER_TEMP\age\age.exe"
          $identity = "$env:RUNNER_TEMP\age-identity.txt"
          $cipher = "$env:RUNNER_TEMP\clicky-ciphertext"
          $plain = "$env:RUNNER_TEMP\clicky-verified-plain"
          New-Item -ItemType Directory -Path $plain -ErrorAction Stop | Out-Null
          & $age -d -i $identity -o "$plain\clicky-source.zip" "$cipher\clicky-source.zip.age"
          if ($LASTEXITCODE -ne 0) { throw "source decryption failed" }
          & $age -d -i $identity -o "$plain\clicky-full-dist.zip" "$cipher\clicky-full-dist.zip.age"
          if ($LASTEXITCODE -ne 0) { throw "dist decryption failed" }
          & $age -d -i $identity -o "$plain\clicky-executable.exe" "$cipher\clicky-executable.exe.age"
          if ($LASTEXITCODE -ne 0) { throw "EXE decryption failed" }
          & $age -d -i $identity -o "$plain\clicky-runtime-evidence.zip" "$cipher\clicky-runtime-evidence.zip.age"
          if ($LASTEXITCODE -ne 0) { throw "evidence decryption failed" }
          python trusted/tools/quarantine_harness.py verify `
            --evidence "$plain\clicky-runtime-evidence.zip" `
            --source "$plain\clicky-source.zip" `
            --distribution "$plain\clicky-full-dist.zip" `
            --executable "$plain\clicky-executable.exe" `
            --output-directory "$env:RUNNER_TEMP\clicky-verified-output" `
            --target-sha "$env:INPUT_TARGET_SHA" `
            --expected-source-sha256 "$env:EXPECTED_SOURCE_SHA256" `
            --workflow-sha "$env:GITHUB_WORKFLOW_SHA" `
            --github-output "$env:GITHUB_OUTPUT"

      - name: Remove the age identity and all decrypted bytes
        if: always()
        shell: pwsh
        run: >-
          Remove-Item -LiteralPath
          "$env:RUNNER_TEMP\age-identity.txt",
          "$env:RUNNER_TEMP\age",
          "$env:RUNNER_TEMP\clicky-ciphertext",
          "$env:RUNNER_TEMP\clicky-verified-plain",
          "$env:RUNNER_TEMP\clicky-verified-output"
          -Recurse -Force -ErrorAction SilentlyContinue

  scan-exact-files:
    name: Scan exact opaque files (age and VT keys)
    needs: verify-evidence
    if: ${{ !inputs.export_for_vendor_submission && needs.verify-evidence.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 110
    permissions:
      contents: read
      actions: read
    env:
      VERIFIED_SOURCE_SHA256: ${{ needs.verify-evidence.outputs.source_sha256 }}
      VERIFIED_DISTRIBUTION_SHA256: ${{ needs.verify-evidence.outputs.distribution_sha256 }}
      VERIFIED_EXECUTABLE_SHA256: ${{ needs.verify-evidence.outputs.executable_sha256 }}
    steps:
      - name: Check out only the trusted workflow revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          set-safe-directory: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Set up the pinned Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.10"
          cache: ""
          check-latest: false

      - name: Validate trusted context
        shell: pwsh
        run: python trusted/tools/quarantine_harness.py validate-context

      - name: Download the encrypted artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.QUARANTINE_ARTIFACT }}
          path: ${{ runner.temp }}/clicky-ciphertext

      - name: Verify ciphertext-only boundaries
        shell: pwsh
        run: >-
          python trusted/tools/quarantine_harness.py verify-ciphertext
          --directory "$env:RUNNER_TEMP\clicky-ciphertext"

      - name: Install hash-pinned age 1.3.1
        shell: pwsh
        run: >-
          python trusted/tools/quarantine_harness.py install-age
          --output "$env:RUNNER_TEMP\age\age.exe"

      - name: Materialize the one-time age identity
        shell: pwsh
        env:
          AGE_SSH_PRIVATE_KEY: ${{ secrets.AGE_SSH_PRIVATE_KEY }}
        run: |
          if ([String]::IsNullOrWhiteSpace($env:AGE_SSH_PRIVATE_KEY)) {
            throw "AGE_SSH_PRIVATE_KEY is missing"
          }
          $identity = "$env:RUNNER_TEMP\age-identity.txt"
          [IO.File]::WriteAllText(
            $identity,
            $env:AGE_SSH_PRIVATE_KEY.Trim() + "`n",
            [Text.UTF8Encoding]::new($false)
          )
          & icacls.exe $identity /inheritance:r /grant:r "$env:USERNAME`:F" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "could not protect age identity ACL" }

      - name: Decrypt only the three direct scan candidates
        shell: pwsh
        run: |
          $age = "$env:RUNNER_TEMP\age\age.exe"
          $identity = "$env:RUNNER_TEMP\age-identity.txt"
          $cipher = "$env:RUNNER_TEMP\clicky-ciphertext"
          $plain = "$env:RUNNER_TEMP\clicky-scan-plain"
          New-Item -ItemType Directory -Path $plain -ErrorAction Stop | Out-Null
          & $age -d -i $identity -o "$plain\clicky-source.zip" "$cipher\clicky-source.zip.age"
          if ($LASTEXITCODE -ne 0) { throw "source decryption failed" }
          & $age -d -i $identity -o "$plain\clicky-full-dist.zip" "$cipher\clicky-full-dist.zip.age"
          if ($LASTEXITCODE -ne 0) { throw "dist decryption failed" }
          & $age -d -i $identity -o "$plain\clicky-executable.exe" "$cipher\clicky-executable.exe.age"
          if ($LASTEXITCODE -ne 0) { throw "EXE decryption failed" }

      - name: Bind opaque scan inputs to verifier hashes
        shell: pwsh
        run: >-
          python trusted/tools/quarantine_harness.py verify-scan-inputs
          --source "$env:RUNNER_TEMP\clicky-scan-plain\clicky-source.zip"
          --distribution "$env:RUNNER_TEMP\clicky-scan-plain\clicky-full-dist.zip"
          --executable "$env:RUNNER_TEMP\clicky-scan-plain\clicky-executable.exe"
          --source-sha256 "$env:VERIFIED_SOURCE_SHA256"
          --distribution-sha256 "$env:VERIFIED_DISTRIBUTION_SHA256"
          --executable-sha256 "$env:VERIFIED_EXECUTABLE_SHA256"

      - name: Submit exact opaque files to VirusTotal
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: >-
          python trusted/tools/quarantine_harness.py virus-total
          --source "$env:RUNNER_TEMP\clicky-scan-plain\clicky-source.zip"
          --distribution "$env:RUNNER_TEMP\clicky-scan-plain\clicky-full-dist.zip"
          --executable "$env:RUNNER_TEMP\clicky-scan-plain\clicky-executable.exe"
          --output "$env:RUNNER_TEMP\virus-total-report.json"

      - name: Remove secrets, reports, ciphertext, and decrypted bytes
        if: always()
        shell: pwsh
        run: >-
          Remove-Item -LiteralPath
          "$env:RUNNER_TEMP\age-identity.txt",
          "$env:RUNNER_TEMP\age",
          "$env:RUNNER_TEMP\clicky-ciphertext",
          "$env:RUNNER_TEMP\clicky-scan-plain",
          "$env:RUNNER_TEMP\virus-total-report.json"
          -Recurse -Force -ErrorAction SilentlyContinue

  cleanup-artifact:
    name: Delete encrypted artifact
    if: ${{ always() && !inputs.export_for_vendor_submission }}
    needs:
      - build-runtime
      - verify-evidence
      - scan-exact-files
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete the encrypted quarantine artifact
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REPOSITORY -cne "th3nolo/clicky-windows-hardened") {
            throw "unexpected cleanup repository"
          }
          if ($env:QUARANTINE_ARTIFACT -cnotmatch '^clicky-quarantine-[0-9]+-[0-9]+$') {
            throw "unsafe artifact name"
          }
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $listUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=100"
          $artifacts = (Invoke-RestMethod -Method Get -Uri $listUrl -Headers $headers).artifacts
          $matches = @($artifacts | Where-Object { $_.name -ceq $env:QUARANTINE_ARTIFACT })
          if ($matches.Count -gt 1) { throw "multiple quarantine artifacts found" }
          if ($matches.Count -eq 1) {
            $deleteUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($matches[0].id)"
            Invoke-RestMethod -Method Delete -Uri $deleteUrl -Headers $headers | Out-Null
            Write-Output "Deleted encrypted quarantine artifact id $($matches[0].id)."
          } else {
            Write-Output "Encrypted quarantine artifact is already absent."
          }
