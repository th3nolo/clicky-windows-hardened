[project]
name = "clicky-windows-hardened"
version = "1.2.0"
description = "A hardened Windows desktop AI companion"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp==3.14.3",
    "anthropic==0.112.0",
    "av==17.1.0",
    "edge-tts==7.2.8",
    "faster-whisper==1.2.1",
    "httpx==0.28.1",
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "keyboard==0.13.5",
    "mss==10.2.0",
    "numpy==2.4.6",
    "openai==2.44.0",
    "opencv-python==4.13.0.92",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "pypdf==6.16.1",
    "pytesseract==0.3.13",
    "pyqt6==6.11.0",
    "python-docx==1.2.0",
    "pywhispercpp==1.5.0",
    "rapidocr-onnxruntime==1.4.4",
    "sounddevice==0.5.5",
    "uiautomation==2.0.29",
    "cryptography==50.0.0",
]

# `langdetect` and `pynput` are intentionally not part of the locked build.
# Their dependency chains do not provide a complete wheel-only resolution.
# The application already treats both features as optional and falls back
# safely when either import is unavailable.

[dependency-groups]
build = [
    "pyinstaller==6.15.0",
]

[tool.uv]
package = false
required-version = "==0.11.19"
exclude-newer = "2026-07-22T00:00:00Z"
exclude-newer-package = { aiohttp = "2026-07-24T00:00:00Z", cryptography = "2026-08-01T00:00:00Z", pypdf = "2026-08-15T00:00:00Z" }
prerelease = "disallow"
resolution = "highest"
no-build = true
no-sources = true
index-strategy = "first-index"
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.mypy]
plugins = ["pydantic.mypy"]
files = [
    "clicky_core",
    "ai/response_text.py",
    "ai/video_input.py",
    "screen/voice_clip.py",
    "ui/media_input.py",
    "turn_coordinator.py",
    "audio/tts/base_tts.py",
    "audio/tts/factory.py",
    "audio/tts/voice_preview.py",
    "audio/tts/voice_catalog.py",
    "ui/microphone_test.py",
    "ui/voice_picker.py",
]
strict = true
disallow_any_explicit = true
follow_imports = "silent"
warn_unused_ignores = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
